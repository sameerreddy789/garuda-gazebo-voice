[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "garudaone-droneos"
version = "0.2.0"
description = "GarudaOne DroneOS — Autonomous AI-powered cinematography drone with voice copilot and 3D simulation"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "GarudaOne Team"},
]

[project.scripts]
garuda = "garuda.main:main"

[tool.setuptools.packages.find]
include = ["garuda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sitl: marks tests that require a real PX4 SITL instance (deselect with '-m \"not sitl\"')",
]
